{# Íconos reutilizables de la aplicación #}
{% macro icono(nombre) -%}
<svg class="icono" viewBox="0 0 24 24" fill="none"
     stroke="currentColor" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round"
     aria-hidden="true">
{%- if nombre == "calculadora" %}
    <rect x="4" y="2" width="16" height="20" rx="2"/>
    <path d="M8 6h8M8 10h.01M12 10h.01M16 10h.01M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01M16 18h.01"/>
{%- elif nombre == "buscar" %}
    <circle cx="11" cy="11" r="7"/>
    <path d="m21 21-4.3-4.3"/>
{%- elif nombre == "base" %}
    <ellipse cx="12" cy="5" rx="8" ry="3"/>
    <path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
{%- elif nombre == "chispa" %}
    <path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/>
{%- endif %}
</svg>
{%- endmacro %}
